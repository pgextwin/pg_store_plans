name: Windows CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@windows-ci
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
  windows_required:
    name: Windows required summary
    if: ${{ always() }}
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pgextwin build infrastructure at the resolved build SHA
        if: ${{ needs.windows.outputs.build_sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: ${{ needs.windows.outputs.build_sha }}
          path: .pgextwin-build
      - name: Require success of all maintained PG14-18 Windows jobs
        env:
          WINDOWS_MATRIX_RESULT: ${{ needs.windows.result }}
          BUILD_SHA: ${{ needs.windows.outputs.build_sha }}
        run: |
          if [ -z "$BUILD_SHA" ]; then
            echo "WINDOWS REQUIRED SUMMARY DENIED: resolved build SHA unavailable" >&2
            exit 2
          fi
          python3 .pgextwin-build/scripts/required_windows_summary.py

  # Only an immutable auto-candidate workflow_dispatch invokes the existing verifier.
  candidate_report:
    name: Verify immutable Windows candidate ZIP, SBOM and Grype
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/auto-candidate/') }}
    needs: windows
    permissions:
      contents: read
      actions: read
      issues: write
    uses: pgextwin/build/.github/workflows/verify-candidate.yml@ecf84241c1c4cd99fab3f964cb309f9c6e2a01f8
    with:
      matrix_result: ${{ needs.windows.result }}
